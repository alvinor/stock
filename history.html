<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告历史日历</title><style>
:root{
  --bg:#0a0d15; --bg2:#0e1320; --card:#141b29; --card2:#10151f;
  --line:#23304a; --line2:#2c3a57; --txt:#e8edf6; --sub:#9aa6bd;
  --blue:#7dd3fc; --violet:#a78bfa; --pink:#f0abfc;
  --up:#ff5a5f; --dn:#22d3a6; --warn:#f6b73c; --gold:#e9c46a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(1100px 520px at 88% -12%, rgba(56,189,248,.10), transparent 60%),
    radial-gradient(900px 480px at -5% 0%, rgba(129,140,248,.10), transparent 55%),
    radial-gradient(700px 400px at 50% 120%, rgba(240,171,252,.05), transparent 60%),
    var(--bg);
  color:var(--txt); padding:26px 22px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.wrap{max-width:1200px;margin:0 auto}
h1{
  font-size:25px; font-weight:800; letter-spacing:.3px; margin-bottom:6px; line-height:1.25;
  background:linear-gradient(92deg,#7dd3fc,#a78bfa 58%,#f0abfc);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.sub{color:var(--sub);font-size:12.5px;margin-bottom:22px;line-height:1.75}
.sub b{color:#cdd6e8}

/* 涨跌色（A股：红涨绿跌） */
.up{color:var(--up)!important;font-weight:600}
.dn,.down{color:var(--dn)!important;font-weight:600}
.flat{color:#9aa6bd!important}

/* 章节标题 */
.sec,.sec-title{
  font-size:16.5px;font-weight:700;color:#fff;margin:30px 0 12px;padding-left:12px;
  border-left:4px solid transparent;
  border-image:linear-gradient(180deg,#38bdf8,#818cf8) 1;
  letter-spacing:.3px;
}
.foot{margin-top:26px;font-size:11.5px;color:#6b7790;line-height:1.8;border-top:1px solid var(--line);padding-top:14px}

/* 通用卡片 / 盒子 */
.card,.box{
  background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:14px;
  box-shadow:0 6px 22px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.03);
  padding:14px 16px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.card:hover,.box:hover{border-color:var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05)}

/* KPI 盒 */
.box h2{font-size:14px;margin:0 0 8px;color:var(--blue);font-weight:700;letter-spacing:.4px}
.kpi{font-size:27px;font-weight:800;line-height:1.1;letter-spacing:.5px}
.kpi.up{color:var(--up)} .kpi.down{color:var(--dn)}
.note{font-size:12.5px;color:#b9c3d6;line-height:1.7;background:rgba(255,255,255,.025);
  border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:0 9px 9px 0;padding:10px 13px;margin-top:8px}

/* 标签 / 主题胶囊 */
.tag{display:inline-block;background:linear-gradient(180deg,#1d2738,#161d2b);color:#a9c7ff;
  padding:4px 11px;border-radius:20px;font-size:12px;margin:3px 4px 3px 0;border:1px solid #243049}
.themes{line-height:2.2}
.tags{margin:4px 0}

/* 表格 */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;
  background:linear-gradient(180deg,#121826,#0f141f);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:4px}
th{background:linear-gradient(180deg,#1a2336,#151c2b);color:#aab6cc;font-weight:700;
  text-align:left;padding:11px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;font-size:12.5px;letter-spacing:.3px}
td{padding:10px;border-bottom:1px solid #1a2233;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.018)}
tbody tr:hover td{background:rgba(56,189,248,.07)}
td.c{color:var(--blue);font-size:12px;font-family:'JetBrains Mono',Consolas,monospace}
td.n{font-weight:700;color:#fff}
td.num{text-align:right;font-family:'JetBrains Mono',Consolas,monospace;white-space:nowrap}
.code{color:var(--blue);font-size:12px;font-family:'JetBrains Mono',Consolas,monospace}

/* 个股大卡（Tab版） */
.card{overflow:hidden;padding:0}
.cardhead{display:flex;align-items:center;gap:12px;padding:15px 18px;flex-wrap:wrap;
  background:linear-gradient(90deg,#1b2436,#141b29);border-bottom:1px solid var(--line)}
.cardhead .code{color:var(--blue);font-size:12px;font-family:'JetBrains Mono',Consolas,monospace}
.cardhead .nm{font-size:18px;font-weight:800;color:#fff;letter-spacing:.4px}
.cardhead .px{font-size:16px;font-weight:800;font-family:'JetBrains Mono',Consolas,monospace;margin-left:auto}
.cardhead .str{font-size:12.5px;font-weight:700;background:rgba(56,189,248,.12);
  color:#9fe0ff;padding:4px 12px;border-radius:20px;border:1px solid #294a6b}
.tabs{display:flex;flex-wrap:wrap;gap:5px;padding:11px 12px 0;background:#0f1521;
  border-bottom:1px solid var(--line)}
.tab{background:#18202f;color:#9aa6bd;border:1px solid #222c40;border-bottom:none;
  padding:8px 15px;border-radius:9px 9px 0 0;cursor:pointer;font-size:13px;font-weight:600;
  transition:all .15s ease}
.tab:hover{color:#dbe4f3;background:#1d2738}
.tab.active{background:linear-gradient(180deg,#2563eb,#3b5bdb);color:#fff;border-color:#3b5bdb;
  box-shadow:0 -2px 12px rgba(59,91,219,.35)}
.tabcontent{padding:18px 16px;background:#0f1521;animation:fade .25s ease}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 键值行 */
.kv{display:flex;justify-content:space-between;gap:18px;padding:8px 0;
  border-bottom:1px dashed #212c40;font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv span{color:#8f9bb4;flex:0 0 auto}
.kv b{color:#e8edf6;text-align:right;max-width:64%;font-weight:600;font-family:'JetBrains Mono',Consolas,monospace;font-size:13px}
.kv b.up,.kv b.dn{font-family:inherit}

/* 支撑/压力 */
.srblock{display:inline-block;vertical-align:top;width:48%;margin-right:2%}
.srlabel{font-weight:800;margin-bottom:8px;font-size:14px;letter-spacing:.5px}
.srlabel[style*="27ae60"],.srlabel.up{color:var(--dn)}
.srlabel[style*="e74c3c"]{color:var(--up)}

/* 新闻 */
.news{padding:10px 0;border-bottom:1px dashed #212c40}
.news:last-child{border-bottom:none}
.nt{font-size:13.5px;color:#dde4f0;line-height:1.6}
.nm{font-size:11px;color:#69748c;margin-top:3px;font-family:'JetBrains Mono',Consolas,monospace}

/* 打法结论 */
.playact{display:inline-block;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;
  font-weight:800;padding:7px 18px;border-radius:9px;font-size:15px;margin-bottom:12px;
  box-shadow:0 4px 14px rgba(239,68,68,.3)}
.playstr{font-size:14px;line-height:1.75;color:#d2dae8;margin-bottom:12px}
.note{border-left:3px solid var(--warn)}

/* 深度挖掘卡 */
.ddcard{background:linear-gradient(135deg,#1a2233,#10151f);border:1px solid #2a3a57;
  border-radius:14px;margin:14px 0;padding:16px 18px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.ddhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid #243049}
.ddnm{font-size:19px;font-weight:800;color:#fff}
.ddcode{color:var(--blue);font-size:12px;font-family:'JetBrains Mono',Consolas,monospace}
.ddstr{font-size:13px;font-weight:700;background:rgba(56,189,248,.12);color:#9fe0ff;
  padding:4px 12px;border-radius:20px;border:1px solid #294a6b}
.ddpx{font-size:15px;font-weight:800;font-family:'JetBrains Mono',Consolas,monospace;margin-left:auto}
.ddbody{display:flex;gap:20px;flex-wrap:wrap}
.ddcol{flex:1;min-width:230px}
.ddt{font-weight:800;color:var(--blue);margin-bottom:10px;font-size:13px;letter-spacing:.4px}
.ddact{display:inline-block;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;
  font-weight:800;padding:6px 16px;border-radius:9px;font-size:14px;margin-bottom:10px}
.dds{font-size:13px;line-height:1.7;color:#d2dae8}

/* 三栏网格 */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px;align-items:start}
@media(max-width:1080px){.grid3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.grid3{grid-template-columns:1fr}}

/* 买入建议：Tier 徽章与列 */
.tier{display:inline-block;padding:2px 9px;border-radius:7px;font-size:11px;font-weight:800;color:#0a0d15}
.tier[style*="3fb950"],.tier.core{background:#3fb950}
.tier[style*="d29922"],.tier.evt{background:#d29922}
.tier[style*="f85149"],.tier.avoid{background:#f85149}
.buy{color:var(--dn)!important;font-weight:800}
.stop{color:var(--up)!important;font-weight:700}
.tgt{color:var(--gold)!important;font-weight:700}
.logic{color:#cfd8e6;line-height:1.55}
.logic hr{border:none;border-top:1px dashed #2a3a57;margin:7px 0}
.risk{color:var(--warn);font-size:12px;line-height:1.6}

/* 卖出建议专用 */
.banner{background:linear-gradient(180deg,rgba(239,68,68,.14),rgba(239,68,68,.07));
  border:1px solid #7a2b2b;border-radius:12px;padding:14px 16px;margin:16px 0;
  font-size:13px;line-height:1.8;color:#ffc9c9}
.banner b{color:#ff8585;font-weight:800}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{border:1px solid #1c2433;padding:9px 9px;text-align:left;vertical-align:top}
.tbl th{background:linear-gradient(180deg,#1a2336,#151c2b);color:#cdd6e8;font-weight:700}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.tag{font-weight:700}
.t-sell{background:rgba(239,68,68,.22);color:#ff9b9b;border:1px solid #5a2a2a}
.t-cut{background:rgba(246,183,60,.18);color:#ffd98b;border:1px solid #5a4a1f}
.t-hold{background:rgba(34,211,166,.16);color:#8be0c4;border:1px solid #1f4a3a}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:12px}
.card h3{margin:0 0 7px;font-size:15px;color:#fff;font-weight:800;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .px{font-size:20px;font-weight:800;font-family:'JetBrains Mono',Consolas,monospace}
.card .why{font-size:12.5px;color:#c2cbd9;line-height:1.65;margin-top:7px}
.card .why b{color:#fff}
.act{display:inline-block;margin-top:9px;padding:5px 12px;border-radius:8px;font-size:12px;font-weight:800;
  background:rgba(239,68,68,.2);color:#ffb4b4;border:1px solid #5a2a2a}
@media(max-width:760px){.cards{grid-template-columns:1fr}}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:760px}
.cell{min-height:74px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px;font-size:13px;cursor:default}
.cell.have{border-color:#7aa2f7;background:rgba(122,162,247,.12);cursor:pointer}
.cell.have:hover{background:rgba(122,162,247,.25)}
.cell .d{font-weight:600;color:#cdd6f4}
.cell .dot{font-size:11px;color:#7aa2f7;margin-top:4px}
.head{display:flex;align-items:center;gap:16px;margin:8px 0 16px}
.head button{background:rgba(122,162,247,.2);color:#cdd6f4;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:14px}
#panel{margin-top:18px;display:none}
#panel a{display:inline-block;margin:6px 8px 0 0;padding:8px 14px;background:rgba(122,162,247,.15);color:#cdd6f4;border-radius:8px;text-decoration:none}
.wd{color:#888;text-align:center;font-size:12px}
</style></head><body><div class="wrap">
<div class="topbar"><a class="back" href="index.html">← 返回主页</a><span class="bt">📅 报告历史日历</span><span class="bs">点击有报告的日期查看当日清单</span></div>
<div class="head"><button onclick="prev()">← 上月</button><span id="mtitle" style="font-size:20px;font-weight:700"></span><button onclick="next()">下月 →</button></div>
<div class="cal"><div class="wd">日</div><div class="wd">一</div><div class="wd">二</div><div class="wd">三</div><div class="wd">四</div><div class="wd">五</div><div class="wd">六</div><div id="grid"></div></div>
<div id="panel"><div class="sec-title" id="ptitle"></div><div id="plinks"></div></div>
<div class="sub" style="margin-top:18px">目前仅 2026-08-13 已生成完整报告套件；后续每日报告将自动归档至此日历。</div>
</div>
<script>
const REP={"2026-08-13": [["收盘复盘", "260813_review.html"], ["早盘作战卡", "260813_morning.html"], ["盘中诊断", "260813_intra.html"], ["买点建议", "260813_buy_advice.html"], ["卖点/减仓", "260813_sell_advice.html"], ["全维档案", "260813_all_tabs.html"]]};
let y=2026,m=8;
const WD=['日','一','二','三','四','五','六'];
function render(){document.getElementById('mtitle').textContent=y+'年'+m+'月';
 const grid=document.getElementById('grid');grid.innerHTML='';
 const first=new Date(y,m-1,1).getDay();const days=new Date(y,m,0).getDate();
 for(let i=0;i<first;i++){const e=document.createElement('div');e.className='cell';grid.appendChild(e);}
 for(let d=1;d<=days;d++){const e=document.createElement('div');const key=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
   e.className='cell'+(REP[key]?' have':'');e.innerHTML='<div class="d">'+d+'</div>'+(REP[key]?'<div class="dot">● '+REP[key].length+' 篇</div>':'');
   if(REP[key])e.onclick=()=>show(key);grid.appendChild(e);}
 document.getElementById('panel').style.display='none';}
function show(key){const p=document.getElementById('panel');p.style.display='block';document.getElementById('ptitle').textContent=key+' 报告清单';
 let h='';REP[key].forEach(r=>h+='<a href="'+r[1]+'">'+r[0]+'</a>');document.getElementById('plinks').innerHTML=h;}
function prev(){m--;if(m<1){m=12;y--;}render();}
function next(){m++;if(m>12){m=1;y++;}render();}
render();
</script></body></html>
